# Canonical Or7 agent-backend route map for dagyrox/hermes-agent.
#
# Merge this block into the dispatcher profile's config.yaml. Keep `enabled:
# false` until backend-status and bounded provenance smokes pass. Activate one
# canary role before enabling the full map. Each chain crosses three distinct
# providers and DeepSeek Flash is always the final leg. No credentials belong
# in this file.
agent_backend_failover:
  enabled: false
  max_attempts_per_leg: 1
  roles:
    default:
      - kind: api
        provider: openai-codex
        model: gpt-6.1-sol
        reasoning_effort: high
      - kind: claude_code
        model: claude-sonnet-5-5
        reasoning_effort: high
        capability_mode: full
      - kind: api
        provider: deepseek
        model: deepseek-flash

    hyperion:
      - kind: api
        provider: openai-codex
        model: gpt-6-luna
        reasoning_effort: high
      - kind: claude_code
        model: claude-sonnet-5-5
        reasoning_effort: high
        capability_mode: orchestrator
      - kind: api
        provider: deepseek
        model: deepseek-flash

    athena:
      - kind: claude_code
        model: claude-opus-5-5
        reasoning_effort: high
        capability_mode: read_only
      - kind: api
        provider: openai-codex
        model: gpt-6.1-sol
        reasoning_effort: high
      - kind: api
        provider: deepseek
        model: deepseek-flash

    talos:
      - kind: api
        provider: openai-codex
        model: gpt-6.1-sol
        reasoning_effort: high
      - kind: claude_code
        model: claude-sonnet-5-5
        reasoning_effort: high
        capability_mode: full
      - kind: api
        provider: deepseek
        model: deepseek-flash

    apollo:
      - kind: claude_code
        model: claude-sonnet-5-5
        reasoning_effort: balanced
        capability_mode: read_only
      - kind: api
        provider: openai-codex
        model: gpt-6.1-sol
        reasoning_effort: high
      - kind: api
        provider: deepseek
        model: deepseek-flash
